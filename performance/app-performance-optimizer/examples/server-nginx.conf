# =============================================================================
# Production Nginx Performance & Edge Delivery Configuration
# Covers: Brotli/Gzip (Lever 09), Browser Caching (Lever 27), and Buffering
# =============================================================================

# Compression settings
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/x-javascript
    application/xml
    image/svg+xml;

# Static Assets: 1-Year Immutable Browser Caching (Lever 27)
location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|woff2?|eot|ttf|svg)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    tcp_nodelay off;
    open_file_cache max=3000 inactive=120s;
    open_file_cache_valid 45s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;
}

# HTML & Dynamic Routes: Must revalidate to ensure immediate updates
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
